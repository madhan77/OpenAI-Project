[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-sales-agent"
version = "0.1.0"
description = "Reference implementation of an enterprise sales enablement agent"
authors = [{name = "OpenAI Project Team"}]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.optional-dependencies]
dev = []

[tool.setuptools.packages.find]
where = ["src"]
